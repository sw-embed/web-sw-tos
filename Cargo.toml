[workspace]
members = ["crates/swtos-frontend", "crates/swtos-host"]

[package]
name = "web-sw-tos"
version = "0.1.0"
edition = "2024"
authors = ["Michael A Wright"]
license = "MIT"
description = "Browser live demo of the SWTOS terminal on an emulated COR24"
repository = "https://github.com/sw-embed/web-sw-tos"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
swtos-host = { path = "crates/swtos-host" }
swtos-frontend = { path = "crates/swtos-frontend" }
cor24-emulator = { path = "../sw-cor24-emulator" }
cor24-isa = { path = "../sw-cor24-isa", features = ["serde"] }
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
gloo = { version = "0.11", features = ["net"] }
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Document",
    "DomRect",
    "Element",
    "HtmlElement",
    "HtmlSelectElement",
    "KeyboardEvent",
    "Window",
]

[dev-dependencies]
swtos-frontend = { path = "crates/swtos-frontend" }

# The emulator is the hot loop in every test: unoptimised it runs tens of
# times slower, which turned `cargo test --workspace` into a ten-minute wait.
# Optimising just the dependency keeps this project's own code debuggable.
[profile.dev.package.cor24-emulator]
opt-level = 3

[profile.dev.package.cor24-isa]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
