[workspace]
members = ["crates/swtos-host"]

[package]
name = "web-sw-tos"
version = "0.1.0"
edition = "2024"
authors = ["Michael A Wright"]
license = "MIT"
description = "Browser live demo of the SWTOS terminal on an emulated COR24"
repository = "https://github.com/sw-embed/web-sw-tos"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cor24-emulator = { path = "../sw-cor24-emulator" }
cor24-isa = { path = "../sw-cor24-isa", features = ["serde"] }
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
gloo = "0.11"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlSelectElement",
    "KeyboardEvent",
    "Window",
]

[profile.release]
opt-level = "z"
lto = true
